<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone | Watch TV Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <header class="showcase">
        <nav class="navbar">
            <img src="netflix-logo.png" alt="Netflix" class="logo">
            <a href="#" class="btn btn-rounded">Sign In</a>
        </nav>

        <div class="showcase-content">
            <h1>Unlimited movies, TV shows and more.</h1>
            <p>Watch anywhere. Cancel anytime.</p>
            <a href="#" class="btn btn-xl">Get Started ></a>
        </div>
    </header>

    <section class="movie-section">
        <h2>Trending Now</h2>
        <div class="movie-row">
            <div class="movie-card"><img src="movie1.jpg" alt="Movie 1"></div>
            <div class="movie-card"><img src="movie2.jpg" alt="Movie 2"></div>
            <div class="movie-card"><img src="movie3.jpg" alt="Movie 3"></div>
            <div class="movie-card"><img src="movie4.jpg" alt="Movie 4"></div>
        </div>
    </section>

    <footer>
        <p>Questions? Call 000-800-040-1843</p>
    </footer>

</body>
</html>
